name: ghostwriter
version: 0.1.0
description: "Local screenplay workspace: Fountain parsing, immutable revisions, proposal workflow with deterministic validation, and stdlib PDF export. Agent tools plus a desktop pane; no third-party runtime dependencies."
author: "Hermes"
provides_tools:
  - ghost_status
  - ghost_list_projects
  - ghost_get_project
  - ghost_history
  - ghost_read_scene
  - ghost_import
  - ghost_propose
  - ghost_check_proposal
  - ghost_accept_proposal
  - ghost_reject_proposal
  - ghost_export_pdf
  - ghost_restore
  - ghost_undo
